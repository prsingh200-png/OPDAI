services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"

  frontend:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r backend/requirements.txt && streamlit run frontend/streamlit_app.py --server.address=0.0.0.0 --server.port=8501"
    environment:
      OPDAI_API_URL: http://backend:8000
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    depends_on:
      - backend
